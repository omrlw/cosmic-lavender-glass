<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">COSMIC Lavender Glass</title>
  <desc id="desc">A colorful lavender glass banner with a compact floating dock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff1f5"/>
      <stop offset=".45" stop-color="#dce0ff"/>
      <stop offset="1" stop-color="#f5d0ef"/>
    </linearGradient>
    <linearGradient id="orb-a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7287fd" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ea76cb" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="orb-b" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#40a02b" stop-opacity=".58"/>
      <stop offset="1" stop-color="#1e66f5" stop-opacity=".78"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#202239" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="620" rx="44" fill="url(#bg)"/>
  <circle cx="140" cy="510" r="230" fill="url(#orb-a)" filter="url(#blur)"/>
  <circle cx="1460" cy="90" r="240" fill="url(#orb-b)" filter="url(#blur)"/>
  <path d="M-80 500C280 260 510 700 830 430s540 150 860-190" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" opacity=".4"/>
  <rect x="28" y="24" width="1544" height="56" rx="28" fill="#fff" opacity=".58"/>
  <circle cx="72" cy="52" r="8" fill="#7287fd"/>
  <circle cx="98" cy="52" r="8" fill="#ea76cb"/>
  <circle cx="124" cy="52" r="8" fill="#40a02b"/>
  <text x="800" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="74" font-weight="750" fill="#202239">COSMIC Lavender Glass</text>
  <text x="800" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#5c5f77">soft glass · readable windows · a dock that stays compact</text>
  <g font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#202239">
    <rect x="438" y="340" width="210" height="52" rx="26" fill="#fff" opacity=".72"/>
    <text x="543" y="373" text-anchor="middle">one-command setup</text>
    <rect x="672" y="340" width="210" height="52" rx="26" fill="#fff" opacity=".72"/>
    <text x="777" y="373" text-anchor="middle">automatic rollback</text>
    <rect x="906" y="340" width="210" height="52" rx="26" fill="#fff" opacity=".72"/>
    <text x="1011" y="373" text-anchor="middle">COSMIC 1.4+</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="472" width="560" height="92" rx="46" fill="#fff" opacity=".7" stroke="#fff" stroke-width="2"/>
    <circle cx="576" cy="518" r="26" fill="#7287fd"/>
    <circle cx="644" cy="518" r="26" fill="#ea76cb"/>
    <circle cx="712" cy="518" r="26" fill="#40a02b"/>
    <circle cx="780" cy="518" r="26" fill="#df8e1d"/>
    <circle cx="848" cy="518" r="26" fill="#1e66f5"/>
    <circle cx="916" cy="518" r="26" fill="#8839ef"/>
    <circle cx="984" cy="518" r="26" fill="#202239"/>
    <circle cx="1052" cy="518" r="26" fill="#acb0be"/>
  </g>
</svg>
