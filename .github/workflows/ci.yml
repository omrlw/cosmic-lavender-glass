name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh lib/common.sh tests/integration.sh
      - name: Run ShellCheck
        run: shellcheck -x install.sh uninstall.sh tests/integration.sh
      - name: Run isolated integration tests
        run: tests/integration.sh
